<!DOCTYPE html>
<html>
<head>
  <title>YouTube Timestamp Bookmarker</title>
  <style>
    /* General body styles */
    body {
      width: 350px;
      font-family: 'Roboto', Arial, sans-serif;
      padding: 16px;
      margin: 0;
      background: #fff;
    }
    
    /* Header styles */
    h1 {
      font-size: 18px;
      margin-bottom: 16px;
      color: #cc0000;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    h1 svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }
    
    /* Tab styles */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 8px;
    }
    
    .tab {
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      color: #606060;
      transition: all 0.2s ease;
    }
    
    .tab.active {
      background: #cc0000;
      color: #fff;
    }
    
    /* Bookmarks list styles */
    .bookmarks-list {
      max-height: 400px;
      overflow-y: auto;
    }
    
    .bookmark-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px;
      border-radius: 8px;
      background: #f9f9f9;
      margin-bottom: 8px;
      transition: all 0.2s ease;
    }
    
    .bookmark-item:hover {
      background: #f0f0f0;
    }
    
    /* Bookmark title and timestamp styles */
    .bookmark-title {
      font-size: 14px;
      color: #0f0f0f;
      margin-bottom: 4px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    
    .bookmark-timestamp {
      font-size: 12px;
      color: #606060;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }
    
    .bookmark-timestamp:hover {
      color: #cc0000;
      background: rgba(204, 0, 0, 0.1);
    }
    
    .bookmark-timestamp-active {
      color: #cc0000;
      background: rgba(204, 0, 0, 0.2);
      animation: pulse 1s ease;
    }
    
    @keyframes pulse {
      0% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
      100% {
        transform: scale(1);
      }
    }
    
    .bookmark-actions {
      display: flex;
      gap: 8px;
    }
    
    .bookmark-delete {
      background: none;
      border: none;
      color: #909090;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      transition: all 0.2s ease;
    }
    
    .bookmark-delete:hover {
      background: rgba(255, 0, 0, 0.1);
      color: #cc0000;
    }
    
    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: #909090;
    }
    
    .empty-state svg {
      width: 48px;
      height: 48px;
      fill: currentColor;
      margin-bottom: 16px;
    }
    
    .empty-state p {
      margin: 0;
      font-size: 14px;
    }
    
    /* Footer styles */
    .footer {
      font-size: 12px;
      color: #909090;
      text-align: center;
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e0e0e0;
    }
    
    /* Dark mode styles */
    @media (prefers-color-scheme: dark) {
      body {
        background: #212121;
        color: #fff;
      }
      
      .bookmark-item {
        background: #2a2a2a;
      }
      
      .bookmark-item:hover {
        background: #3a3a3a;
      }
      
      .bookmark-title {
        color: #fff;
      }
      
      .bookmark-timestamp {
        color: #aaa;
      }
      
      .bookmark-timestamp:hover {
        background: rgba(204, 0, 0, 0.2);
      }
      
      .tab {
        color: #aaa;
      }
      
      .footer {
        border-top-color: #3a3a3a;
      }
    }
  </style>
</head>
<body>
  <h1>
    <svg viewBox="0 0 24 24">
      <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
    </svg>
    YouTube Timestamp Bookmarker
  </h1>
  
  <div class="tabs">
    <div class="tab active" data-tab="all">All Bookmarks</div>
    <div class="tab" data-tab="current">Current Video</div>
  </div>
  
  <div class="bookmarks-list" id="bookmarksList">
    <!-- Bookmarks will be inserted here -->
  </div>
  
  <div class="footer">
    Click a timestamp to jump to that point in the video
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
